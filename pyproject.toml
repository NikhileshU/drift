[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getdrift"
version = "0.1.0"
description = "Repo-embedded regression tracking for LLM/agent evals: immutable snapshots per git commit, bucketed diffs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Drift" }]
keywords = ["llm", "evals", "regression", "snapshot", "diff"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
]
# Floors verified: the full suite (371 tests, PYTHONPATH pinned to src/) passes green
# against typer 0.12.0, rich 14.0.0, jsonschema 4.20.0, PyYAML 6.0.0 in an isolated venv
# (2026-09-03). No upper bounds — Drift is a library other projects import, and a
# ceiling here just pushes resolver conflicts onto every downstream user; CI catches
# breakage on our side instead. jsonschema's floor matters most: it parses untrusted
# input (ingested harness output, on-disk results.json).
dependencies = [
  "typer>=0.12",
  "rich>=14.0",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "opentelemetry-sdk>=1.20"]
# Only needed to register DriftSpanCollector as a live span processor; the span ->
# results.json conversion itself has no OTel dependency.
otel = ["opentelemetry-sdk>=1.20"]

[project.scripts]
drift = "getdrift.cli:main"

# Installing getdrift is the whole install: pytest discovers the plugin through this
# entry point, so an eval suite needs no conftest edit and no import.
[project.entry-points.pytest11]
drift = "getdrift.pytest_plugin"

[project.urls]
Homepage = "https://github.com/getdrift/drift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
getdrift = ["schemas/*.json", "templates/*.yaml"]

[tool.pytest.ini_options]
# Measuring coverage: use `coverage run --branch --source=getdrift -m pytest`, not
# `pytest --cov=getdrift`. getdrift registers as a pytest11 entry-point plugin, so its
# top-level code runs during pytest's plugin bootstrap, before pytest-cov's own hook
# attaches tracing — `pytest --cov` under-reports by ~12 points (77% vs the real 89%)
# and coverage.py warns "module-not-measured" when this happens.
#
# The suite is `tests/`, and only `tests/`. Without this, what "the tests" means depends
# on how pytest was invoked: a bare run from the repo root also collects
# `examples/pytest/tests/`, which is sample eval data, not a test of Drift. Two people
# then report two different totals for the same commit. The example suite is still
# protected — `tests/test_pytest_plugin.py` runs it the way a user would.
testpaths = ["tests"]
# `testpaths` only applies when no path is given on the command line, so
# `pytest /path/to/drift` from elsewhere would still descend into examples/ and collect
# five more. Excluding it from recursion makes the count identical however you invoke it.
# (These are pytest's own defaults plus `examples`.)
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "examples"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getdrift"
version = "0.1.0"
description = "Repo-embedded regression tracking for LLM/agent evals: immutable snapshots per git commit, bucketed diffs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Drift" }]
keywords = ["llm", "evals", "regression", "snapshot", "diff"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.9",
  "rich>=13.0",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
drift = "getdrift.cli:main"

[project.urls]
Homepage = "https://github.com/getdrift/drift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
getdrift = ["schemas/*.json", "templates/*.yaml"]

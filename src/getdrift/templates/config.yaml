# Drift configuration.
# Keys are defined here with empty values on purpose — fill in what your repo needs.

# Where the golden-set eval cases live, relative to the repo root.
golden_set_path: ".drift/golden_set"

# Configuration for the scorer / judge that produced `metric_scores`.
# e.g. rubric path, judge model, temperature. Free-form: Drift does not read it.
scorer_config: {}

# Configuration for the model under test.
# e.g. provider, model id, decoding params. Free-form: Drift does not read it.
model_config: {}

# Score delta that counts as Improved / Degraded in `drift diff`.
# Uncomment to override the built-in default of 0.05; --threshold overrides both.
# diff_threshold: 0.05

# How many times the harness is expected to run each eval case. Drift does not run
# your evals — this is the count it expects to find in each case's `runs` array, and
# `drift snapshot` warns when a case carries fewer. Repeating a case is what makes a
# regression separable from sampling noise; at N=1 there is no noise estimate at all.
# runs_per_case: 3

# How many combined standard deviations a score change must clear before `drift diff`
# will call it Improved or Degraded. Lower this and sampling noise starts reading as
# regressions; the remedy for a change you believe is real but cannot clear the floor
# is more runs, not a smaller sigma. `--noise-sigma` overrides it.
# noise_sigma: 2.0

# Refuse to snapshot when --judge-version is left at the `unset` placeholder.
# Off by default. Turn it on once your harness reports a real rubric or judge version:
# a snapshot is immutable, so provenance missing at write time is missing forever, and
# `drift diff` cannot tell whether two such snapshots are comparable at all.
# require_judge_version: true

# Branch `drift ci` reads its default --baseline from: the newest commit on this
# branch that has a snapshot. Only consulted when --baseline is omitted.
default_branch: "main"

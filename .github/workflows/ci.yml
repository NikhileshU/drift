# Drift's own test suite. This is the workflow the README's test-status badge points at.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Drift keys snapshots to commit hashes and `drift ci` walks the branch to
          # pick a baseline, so its own tests need real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,otel]"

      - name: Configure git
        # The suite builds throwaway repos and commits in them; git refuses without an
        # identity, and the runner has none by default.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Drift CI"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python -m pytest -q

description: Drift sample eval
providers:
  - id: echo
  - id: file://upper.js
prompts:
  - "{{answer}}"
tests:
  - description: refund_policy_multi_turn
    vars: { answer: "Our refund window is 30 days from delivery." }
    assert: [{ type: contains, value: "30 days", metric: answer_correctness }]
  - description: escalation_tone_angry_customer
    vars: { answer: "Calm down." }
    assert: [{ type: contains, value: "I understand", metric: answer_correctness }]
